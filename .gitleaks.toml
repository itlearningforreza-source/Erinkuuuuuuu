[extend]
# Use the default gitleaks config as base
useDefault = true

[allowlist]
description = "Allowlisted secrets for ERIN development"
paths = [
  "*.md",
  "*.txt",
  "*.json",
  "*.yaml",
  "*.yml",
  "*.toml",
  "*.example",
  "*.sample",
  "*.template",
  "test*",
  "*_test*",
  "*test*",
  "fixtures/*",
  "testdata/*",
]
commits = []
regexes = [
  # Allow test API keys and example credentials
  '''(?i)(test|example|sample|dummy|fake|mock|placeholder)['\"]?\s*[:=]\s*['\"]?[a-zA-Z0-9]{20,}''',
  # Allow ERIN-specific test keys
  '''erin[_-]?(test|dev|example)['\"]?\s*[:=]\s*['\"]?[a-zA-Z0-9]{20,}''',
]

[[rules]]
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)['\"]?\s*[:=]\s*['\"]?[a-zA-Z0-9]{20,}'''
tags = ["key", "api"]

[[rules]]
description = "Generic Secret"
regex = '''(?i)(secret|password|passwd|pwd)['\"]?\s*[:=]\s*['\"]?[^\s]{8,}'''
tags = ["secret", "password"]

[[rules]]
description = "AWS Access Key"
regex = '''(?i)AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
description = "AWS Secret Key"
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key['\"]?\s*[:=]\s*['\"]?[A-Za-z0-9/+=]{40}'''
tags = ["aws", "secret"]

[[rules]]
description = "GitHub Token"
regex = '''(?i)gh[ps]_[A-Za-z0-9_]{36,}'''
tags = ["github", "token"]

[[rules]]
description = "GitLab Token"
regex = '''(?i)glpat-[A-Za-z0-9_-]{20,}'''
tags = ["gitlab", "token"]


[project]
name = "erin-workspace"
version = "0.1.0"
description = "ERIN workspace package"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["erin*"]

[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
]

[workspace.dependencies]
# Tauri 2
tauri = { version = "2.0.0", features = [] }
tauri-build = { version = "2.0.0", features = [] }
tauri-plugin-dialog = { version = "2.0.0", features = [] }
tauri-plugin-fs = { version = "2.0.0", features = [] }
tauri-plugin-shell = { version = "2.0.0", features = [] }
tauri-plugin-http = { version = "2.0.0", features = [] }
tauri-plugin-store = { version = "2.0.0", features = [] }
tauri-plugin-clipboard-manager = { version = "2.0.0", features = [] }
tauri-plugin-global-shortcut = { version = "2.0.0", features = [] }
tauri-plugin-window-state = { version = "2.0.0", features = [] }
tauri-plugin-positioner = { version = "2.0.0", features = [] }
tauri-plugin-opener = { version = "2.0.0", features = [] }
tauri-plugin-log = { version = "2.0.0", features = [] }
tauri-plugin-process = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }

# WebView / Wry
wry = { version = "0.48", features = [] }
webview2-com = { version = "0.28", features = [] }

# Serialization
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
serde_with = "3.5.0"
toml = "0.8.19"
toml_edit = "0.22.7"

# Async
tokio = { version = "1.39", features = ["full", "macros"] }
tokio-util = { version = "0.7.10", features = ["full"] }
futures = "0.3.28"
async-trait = "0.1.77"

# HTTP
reqwest = { version = "0.12.5", features = ["json", "rustls-tls", "cookies", "gzip", "brotli", "stream"] }
http = "1.1.0"
hyper = { version = "1.4.0", features = ["full"] }
hyper-tls = "0.5.0"
rustls = "0.23.0"
rustls-pemfile = "2.1.0"

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["__rustls-tls", "native-tls"] }
tungstenite = "0.21.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "bigdecimal", "json"] }
rusqlite = { version = "0.31.0", features = ["bundled", "modern_sqlite", "serde_json", "chrono", "uuid"] }
duckdb = { version = "1.1.0", features = [] }
arrow2 = { version = "0.17", features = ["csv", "compute", "io_flight"] }
parquet2 = { version = "0.17", features = ["snappy"] }

# Time
chrono = { version = "0.4", features = ["serde", "clock", "rkyv"] }
time = { version = "0.3.34", features = ["serde", "formatting", "parsing", "local-offset", "macros"] }

# UUID
uuid = { version = "1.8.0", features = ["v4", "v7", "serde", "fast-rng"] }
ulid = "1.1.0"

# Crypto
ring = "0.17.8"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
x25519-dalek = "2.0.0"
ed25519-dalek = "2.1.0"
p256 = "0.13.2"
p384 = "0.13.0"
secp256k1 = "0.28.0"
sha2 = "0.10.8"
blake3 = "1.5.0"
hmac = "0.12.1"
pbkdf2 = "0.12.0"
zeroize = "1.7.0"
secrecy = "0.10.0"

# Error handling
anyhow = "1.0.86"
thiserror = "1.0.61"
eyre = "0.6.11"
snafu = { version = "0.7.5", features = ["backtrace"] }

# Logging
tracing = { version = "0.1.40", features = ["std", "log", "valuable"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "json", "registry", "std"] }
tracing-appender = "0.2.2"
tracing-error = "0.2.0"
tracing-opentelemetry = "0.27.0"
opentelemetry = { version = "0.27.0", features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.27.0", features = ["tonic"] }
opentelemetry-prometheus = "0.27.0"
opentelemetry-stdout = "0.27.0"
metrics = "0.21.1"
metrics-exporter-prometheus = "0.13.0"

# Configuration
config = "0.14.0"
figment = { version = "0.10", features = ["toml", "env"] }
dirs = "5.0.1"
dirs-next = "2.0.0"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "cargo"] }
clap_complete = "4.5"

# Parallelism
rayon = "1.10.0"
crossbeam = "0.8.4"
dashmap = "5.5.3"
parking_lot = "0.12.3"
once_cell = "1.19.0"
lazy_static = "1.4.0"

# Collections
indexmap = { version = "2.2.0", features = ["serde"] }
hashbrown = "0.14.3"
smallvec = "1.13.1"
tinyvec = "1.6.0"
slotmap = "1.0.6"
generational-arena = "0.2"

# Math
num-traits = "0.2.17"
num-bigint = "0.4.4"
num-rational = "0.4.1"
num-complex = "0.4.4"
nalgebra = { version = "0.32.3", features = ["serde", "proptest"] }
ndarray = { version = "0.16.1", features = ["serde", "rayon"] }
rand = { version = "0.9.0", features = ["std", "small_rng", "serde"] }
rand_chacha = "0.9.0"
rand_distr = "0.6"
statrs = "0.16.1"

# Compression
flate2 = "1.0.30"
zstd = { version = "0.13", features = ["zstdmt"] }
snap = "1.1.0"
lz4 = "1.28"
brotli = "3.4.0"

# File I/O
walkdir = "2.5.0"
ignore = "0.4"
glob = "0.3"
notify = { version = "6.1.1", features = ["mio"] }
async-fs = "1.6.0"
async-std = { version = "1.12.0", features = ["attributes", "unstable"] }

# Testing
proptest = "1.3.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
assert_cmd = "2.0.14"
predicates = "3.0.5"
mockall = "0.13.0"
wiremock = "0.5.6"
testcontainers = "0.19"

# Benchmarking
criterion = { version = "0.5.1", features = ["html_reports", "async"] }

# Linting / Formatting
clippy = "0.0.212"
rustfmt = "1.0.0"

# Profiling
pprof = { version = "0.12", features = ["flamegraph"] }
flamegraph = "0.5.0"

# Misc
bitflags = "2.5.0"
enumflags2 = "0.7.12"
strum = { version = "0.26", features = ["derive"] }
displaydoc = "0.2.5"
derive_more = "0.99.17"
derive_builder = "0.13.1"
typed-builder = "0.18.0"
bon = "3.10"
paste = "1.0.14"
const_format = "0.2.32"
const_format_proc_macros = "0.2.32"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
cognitive_complexity = "warn"
perf = "warn"
style = "warn"
correctness = "warn"
suspicious = "warn"
complexity = "warn"
restriction = "allow"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
rpath = false
split-debuginfo = "unpacked"
debug-info-for-profiling = true
strip = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
rpath = false
strip = true
panic = "abort"

[profile.test]
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
lto = false

[profile.bench]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
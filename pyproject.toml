severity = ["medium", "high"]
confidence = ["high", "medium"]

[tool.coverage.run]
source = ["packages", "apps/api"]
omit = ["tests/*", "models/*", "scripts/*"]
branch = true
parallel = true
concurrency = "multiprocessing"
data_file = ".coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.hypothesis]
database = ".hypothesis"
verbosity = "verbose"
phases = ["explicit", "reuse", "generate", "shrink"]
max_examples = 1000
min_satisfying_examples = 100
deadline = 5000
print_blob = true
derandomize = true
suppress_health_check = ["too_slow", "data_too_large"]

[tool.pytest-benchmark]
min_rounds = 5
max_time = 1.0
timer = "time.perf_counter"
disable_gc = true
warmup = true
warmup_iterations = 3
benchmark_dir = "artifacts/benchmarks"

[tool.semgrep]
config = "auto"
rules = ["p/security-audit", "p/secrets", "p/python"]
exclude = ["tests", "models", "scripts", ".git", "__pycache__", "*.pyc", ".venv", "venv", "env", ".env"]
json = "artifacts/semgrep.json"
metrics = "off"
error = true

[tool.pip-audit]
format = "json"
output = "artifacts/pip-audit.json"
desc = true
fix = false
dry-run = false

[tool.cargo-audit]
format = "json"
output = "artifacts/cargo-audit.json"
ignore = []

[tool.syft]
format = "cyclonedx-json"
output = "artifacts/sbom.json"

[tool.grype]
format = "json"
output = "artifacts/grype.json"
fail-on = "high"

[tool.cosign]
key = "env://COSIGN_PRIVATE_KEY"
password = "env://COSIGN_PASSWORD"
tlog-upload = true
rekor-url = "https://rekor.sigstore.dev"

[tool.pre-commit]
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
fail_fast = true
verbose = true

[tool.uv.sources]
# Exact versions for reproducibility - all deps pinned above
# Override specific versions if needed:
# pydantic = {version = "==2.9.2", index = "pypi"}
# fastapi = {version = "==0.111.0", index = "pypi"}

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/api",
]

[tool.uv.pip]
compile-bytecode = true
link-mode = "copy"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]
include = ["erin*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "property: Property-based tests",
    "verification: Financial model verification",
    "benchmark: Performance benchmarks",
    "slow: Slow tests (>10s)",
    "reference: Requires external reference (QuantLib)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
skip-trailing-comma = true
fixable = ["ALL"]
unfixable = []
lint.select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "T20", "PYI", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "SIM", "TCH", "PTH", "ERA", "PD011",
]
lint.ignore = [
    "E501", "B008", "C901", "T201", "T203",
]
lint.per-file-ignores = { "tests/*" = ["S101", "S106"], "models/*" = ["S101"] }
format.quote-style = "double"
format.indent-style = "space"
format.line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_optional = false
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages:apps/api"
plugins = ["pydantic.mypy"]


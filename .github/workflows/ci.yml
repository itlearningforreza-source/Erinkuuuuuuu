name: ERIN CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  RUST_VERSION: 'stable'

jobs:
  # Linting & Type Checking
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run MyPy typecheck
        run: uv run mypy .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm biome check .

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Run Prettier format check
        run: pnpm format:check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run Bandit security scan
        run: uv run bandit -r . -f json -o artifacts/bandit.json || true

      - name: Run pip-audit
        run: uv run pip-audit --format=json --output=artifacts/pip-audit.json || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo audit
        run: cargo audit --json > artifacts/cargo-audit.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --json > artifacts/npm-audit.json || true

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/javascript
            p/typescript
          generateSarif: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.sha }}
          extra_args: --json=artifacts/trufflehog.json --fail

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          args: --report-format=json --report-path=artifacts/gitleaks.json

      - name: Build Docker image
        run: docker build -t erin:test .

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'erin:test'
          format: 'json'
          output: 'artifacts/trivy.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: artifacts/sbom.json

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: artifacts/
          retention-days: 30

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run Python unit tests
        run: uv run pytest tests/unit -v --tb=short -x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --workspace --lib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript unit tests
        run: pnpm vitest run --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Start Docker services
        run: docker-compose up -d redis

      - name: Run integration tests
        run: uv run pytest tests/integration -v --tb=short -x

      - name: Cleanup
        run: docker-compose down

  # Contract Tests
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run contract tests
        run: uv run python -m scripts.ecp.contract_test

  # Financial Model Verification
  financial-verification:
    name: Financial Model Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run financial model verification tests
        run: uv run pytest models/ -m "verification" -v --tb=long

  # Property-Based Tests
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run property-based tests
        run: uv run pytest tests/property -v --tb=short -x

  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Install Playwright
        run: pnpm playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm playwright test

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Resource Profiling
  resource-profile:
    name: Resource Profile
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run resource profile (CI profile)
        run: uv run python -m scripts.ecp.resource_profile --profile ci

      - name: Upload resource profile
        uses: actions/upload-artifact@v4
        with:
          name: resource-profile
          path: artifacts/resource_profile.json
          retention-days: 7

  # Architecture Compliance
  architecture-check:
    name: Architecture Compliance
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run architecture check
        run: uv run python -m scripts.ecp.arch_check

  # Build & Release
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: [
      lint-and-typecheck,
      security-scan,
      unit-tests,
      integration-tests,
      contract-tests,
      financial-verification,
      property-tests,
      e2e-tests,
      resource-profile,
      architecture-check
    ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'uv'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Release Gate
        run: uv run python -m scripts.ecp.release_gate

      - name: Build Tauri app (all platforms)
        run: pnpm tauri build --target universal-apple-darwin --target x86_64-pc-windows-msvc --target x86_64-unknown-linux-gnu

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: artifacts/sbom.json

      - name: Sign artifacts with Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign binaries
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/erin-linux.sig \
            --output-certificate artifacts/erin-linux.pem \
            artifacts/erin-linux

          cosign sign-blob --yes \
            --output-signature artifacts/erin-windows.exe.sig \
            --output-certificate artifacts/erin-windows.exe.pem \
            artifacts/erin-windows.exe

          cosign sign-blob --yes \
            --output-signature artifacts/erin-macos.sig \
            --output-certificate artifacts/erin-macos.pem \
            artifacts/erin-macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/erin-linux
            artifacts/erin-linux.sig
            artifacts/erin-linux.pem
            artifacts/erin-windows.exe
            artifacts/erin-windows.exe.sig
            artifacts/erin-windows.exe.pem
            artifacts/erin-macos
            artifacts/erin-macos.sig
            artifacts/erin-macos.pem
            artifacts/sbom.json
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: artifacts/
          retention-days: 90